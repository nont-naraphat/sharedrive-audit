<!doctype html>
<meta charset="utf-8">
<title>Group Mail Audit — Google Workspace Groups</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{
    --bg:#f6f7f9; --panel:#fff; --line:#e6e8eb; --ink:#1f2328; --mut:#6a737d;
    --accent:#2f7d4f; --accentbg:#e8f3ec; --hover:#f0f2f4; --chip:#eef1f4;
    --block:#c0392b; --blockbg:#f8d7da; --warn:#9a6700; --warnbg:#fff3cd;
    --ok:#1a7f37; --okbg:#d4edda;
    --r-OWNER:#8250df; --r-MANAGER:#0969da; --r-MEMBER:#6a737d;
  }
  *{box-sizing:border-box}
  body{margin:0;font:14px/1.45 -apple-system,Segoe UI,Roboto,"Noto Sans Thai",Arial,sans-serif;color:var(--ink);background:var(--bg)}
  header{display:flex;align-items:center;gap:12px;padding:12px 18px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;flex-wrap:wrap}
  header h1{font-size:16px;margin:0;font-weight:650}
  header .meta{color:var(--mut);font-size:12px}
  header .grow{flex:1}
  a.nav{color:var(--mut);text-decoration:none;font-size:13px;border:1px solid var(--line);border-radius:8px;padding:6px 11px}
  a.nav:hover{background:var(--hover)}
  input[type=search]{border:1px solid var(--line);border-radius:8px;padding:7px 11px;width:220px;font:inherit}
  button{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 13px;font:inherit;cursor:pointer;color:var(--ink);display:inline-flex;align-items:center;gap:6px}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  button:hover{background:var(--hover)} button.primary:hover{filter:brightness(1.05)}
  button:disabled{opacity:.55;cursor:default}
  .spin{width:13px;height:13px;border:2px solid #fff6;border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  .preview{background:var(--warnbg);border-bottom:1px solid #f0e0a8;color:#7a5c00;font-size:12.5px;padding:7px 18px;display:none}
  .preview b{color:#5c4600}
  .chips{display:flex;gap:8px;flex-wrap:wrap;padding:10px 18px;align-items:center}
  .chip{background:var(--chip);border-radius:999px;padding:4px 12px;font-size:12px;color:var(--mut);cursor:default}
  .chip b{color:var(--ink)}
  .chip.flag{background:var(--blockbg);color:var(--block)}
  .chip.flag b{color:var(--block)}
  .chip.act{cursor:pointer} .chip.act:hover{filter:brightness(.97)}
  .chip.act.on{outline:2px solid var(--block);outline-offset:1px}
  .wrap{display:grid;grid-template-columns:390px 1fr;height:calc(100vh - 132px)}
  .left{overflow:auto;background:var(--panel);border-right:1px solid var(--line)}
  .glist{padding:6px}
  .grow-row{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:9px;cursor:pointer}
  .grow-row:hover{background:var(--hover)} .grow-row.sel{background:var(--accentbg)}
  .grow-row .ic{font-size:17px;flex:0 0 auto}
  .grow-row .who{min-width:0;flex:1 1 auto}
  .grow-row .who .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .grow-row .who .e{font-size:11.5px;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .grow-row .mc{font-size:11px;color:var(--mut);flex:0 0 auto;text-align:right}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--block);flex:0 0 auto}
  .detail{overflow:auto;padding:18px 22px;background:var(--bg)}
  .detail h2{font-size:16px;margin:0 0 4px}
  .detail .sub{color:var(--mut);font-size:12.5px;word-break:break-all;margin-bottom:16px}
  .kv{display:grid;grid-template-columns:150px 1fr;gap:6px 12px;font-size:13px;margin-bottom:18px}
  .kv .k{color:var(--mut)}.kv .v{word-break:break-word}
  .mtitle{font-size:12px;text-transform:uppercase;letter-spacing:.4px;color:var(--mut);margin:18px 0 8px;font-weight:650}
  table.m{width:100%;border-collapse:collapse;font-size:13px;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
  table.m th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.3px;color:var(--mut);font-weight:650;padding:9px 12px;border-bottom:1px solid var(--line);background:#fafbfc}
  table.m td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
  table.m tr:last-child td{border-bottom:0}
  table.m tr.ext td{background:#fdf0f1}
  .role{font-size:11px;font-weight:600;padding:2px 9px;border-radius:999px;color:#fff;white-space:nowrap}
  .tag{font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap}
  .tag.ext{background:var(--block);color:#fff}
  .tag.grp{background:#eef1f4;color:var(--mut)}
  .tag.yes{background:var(--blockbg);color:var(--block)}
  .tag.no{background:var(--okbg);color:var(--ok)}
  .empty{color:var(--mut);padding:52px 18px;text-align:center}
  .hl{background:#fff2a8;border-radius:3px}
  .err{color:var(--block);font-size:13px;padding:6px 18px}
</style>

<header>
  <h1>📧 Group Mail Audit</h1>
  <span class="meta">Google Workspace Groups · 21sunpassion.com</span>
  <span class="grow"></span>
  <a class="nav" href="/">← กลับหน้า Audit</a>
  <input type="search" id="q" placeholder="ค้นหาชื่อ / อีเมลกลุ่ม…">
  <button id="refresh" onclick="doRefresh()"><span id="rico">🔄</span> <span id="rtxt">Sync ตอนนี้</span></button>
  <button class="primary" onclick="doExport()">⬇ Export Excel</button>
</header>

<div class="preview" id="prev">⚠️ <b>โหมดพรีวิว</b> — ยังไม่ต่อ backend กำลังแสดง <b>ข้อมูลตัวอย่าง</b> เพื่อดู layout เมื่อ deploy endpoint <code>/api/groups/*</code> แล้วหน้านี้จะดึงข้อมูลจริงอัตโนมัติ</div>

<div class="chips" id="chips"></div>
<div class="err" id="err"></div>

<div class="wrap">
  <div class="left"><div class="glist" id="glist"><div class="empty">กำลังโหลด…</div></div></div>
  <div class="detail" id="detail"><div class="empty">เลือกกลุ่มทางซ้ายเพื่อดูสมาชิกและการตั้งค่า</div></div>
</div>

<script>
let GROUPS=[], FILTER_EXT=false, selEmail=null, PREVIEW=false, polling=null;
const INTERNAL=["office21sun.com","21sunpassion.com","sunsusolution.com"];
const esc=s=>(s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// ---------- Thai labels for group settings ----------
const SET_TH={
  whoCanJoin:{label:"ใครเข้ากลุ่มได้", map:{INVITED_CAN_JOIN:"ต้องเชิญ",CAN_REQUEST_TO_JOIN:"ขอเข้าได้",ALL_IN_DOMAIN_CAN_JOIN:"คนในโดเมนเข้าได้",ANYONE_CAN_JOIN:"ใครก็เข้าได้"}},
  whoCanPostMessage:{label:"ใครโพสต์ได้", map:{ALL_MEMBERS_CAN_POST:"สมาชิกทุกคน",ALL_MANAGERS_CAN_POST:"ผู้จัดการ",ALL_IN_DOMAIN_CAN_POST:"คนในโดเมน",ANYONE_CAN_POST:"ใครก็โพสต์ได้"}},
  whoCanViewMembership:{label:"ใครเห็นรายชื่อสมาชิก", map:{ALL_MEMBERS_CAN_VIEW:"สมาชิก",ALL_MANAGERS_CAN_VIEW:"ผู้จัดการ",ALL_IN_DOMAIN_CAN_VIEW:"คนในโดเมน"}},
};
const roleBadge=r=>{const c=(getComputedStyle(document.documentElement).getPropertyValue('--r-'+r)||'#6a737d').trim();return `<span class="role" style="background:${c}">${esc(r)}</span>`;};
const isExternalEmail=e=>{const d=(e||'').split('@')[1]||'';return d&&!INTERNAL.includes(d.toLowerCase());};
const groupHasExternal=g=>(g.allowExternalMembers)|| (g.members||[]).some(m=>m.external);

// ---------- boot: try real API, fall back to sample ----------
async function boot(){
  try{
    const r=await fetch('/api/groups/list');
    if(r.ok){ const d=await r.json(); GROUPS=d.groups||[]; PREVIEW=false; }
    else throw new Error('no-api');
  }catch(e){ GROUPS=SAMPLE(); PREVIEW=true; document.getElementById('prev').style.display='block'; }
  GROUPS.forEach(g=>{ g._extCount=(g.members||[]).filter(m=>m.external).length; g._flag=groupHasExternal(g); });
  renderChips(); renderList();
}

function renderChips(){
  const totMembers=new Set();
  GROUPS.forEach(g=>(g.members||[]).forEach(m=>totMembers.add(m.email)));
  const extGroups=GROUPS.filter(g=>g._flag).length;
  const allowExt=GROUPS.filter(g=>g.allowExternalMembers).length;
  document.getElementById('chips').innerHTML=
    `<span class="chip"><b>${GROUPS.length}</b> กลุ่ม</span>`+
    `<span class="chip"><b>${totMembers.size.toLocaleString()}</b> สมาชิก (ไม่ซ้ำ)</span>`+
    `<span class="chip act flag${FILTER_EXT?' on':''}" onclick="toggleExt()"><b>${extGroups}</b> กลุ่มมีสมาชิกนอกองค์กร ${FILTER_EXT?'✕':'▸'}</span>`+
    `<span class="chip flag"><b>${allowExt}</b> กลุ่มเปิดรับ external</span>`;
}
function toggleExt(){ FILTER_EXT=!FILTER_EXT; renderChips(); renderList(); }

function renderList(){
  const term=document.getElementById('q').value.trim().toLowerCase();
  let rows=[...GROUPS].sort((a,b)=>(b._flag-a._flag)||((b.memberCount||0)-(a.memberCount||0)));
  if(FILTER_EXT) rows=rows.filter(g=>g._flag);
  if(term) rows=rows.filter(g=>(g.name||'').toLowerCase().includes(term)||(g.email||'').toLowerCase().includes(term));
  const box=document.getElementById('glist');
  if(!rows.length){ box.innerHTML='<div class="empty">ไม่พบกลุ่มตามเงื่อนไข</div>'; return; }
  box.innerHTML=rows.map(g=>{
    const nm=highlight(g.name,term), em=highlight(g.email,term);
    return `<div class="grow-row${g.email===selEmail?' sel':''}" onclick="select('${esc(g.email)}')">
      <div class="ic">📧</div>
      <div class="who"><div class="t">${nm}</div><div class="e">${em}</div></div>
      ${g._flag?'<div class="dot" title="มีสมาชิก/เปิดรับนอกองค์กร"></div>':''}
      <div class="mc">${(g.memberCount||0)} คน</div>
    </div>`;
  }).join('');
}
function highlight(s,term){s=esc(s||'');if(!term)return s;return s.replace(new RegExp('('+term.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig'),'<span class="hl">$1</span>');}

function select(email){
  selEmail=email; renderList();
  const g=GROUPS.find(x=>x.email===email); if(!g) return;
  const st=g.settings||{};
  let kv=`<div class="kv">
    <div class="k">อีเมลกลุ่ม</div><div class="v">${esc(g.email)}</div>
    <div class="k">คำอธิบาย</div><div class="v">${esc(g.description)||'—'}</div>
    <div class="k">จำนวนสมาชิก</div><div class="v">${(g.memberCount||0)} คน</div>
    <div class="k">Aliases</div><div class="v">${(g.aliases&&g.aliases.length)?g.aliases.map(esc).join(', '):'—'}</div>
    <div class="k">รับสมาชิกนอกองค์กร</div><div class="v"><span class="tag ${g.allowExternalMembers?'yes':'no'}">${g.allowExternalMembers?'อนุญาต':'ไม่อนุญาต'}</span></div>`;
  for(const key of Object.keys(SET_TH)){ if(st[key]!=null){ const d=SET_TH[key]; kv+=`<div class="k">${d.label}</div><div class="v">${esc(d.map[st[key]]||st[key])}</div>`; } }
  kv+=`</div>`;

  const ms=[...(g.members||[])].sort((a,b)=>{const o={OWNER:0,MANAGER:1,MEMBER:2};return (o[a.role]??9)-(o[b.role]??9)||(b.external-a.external);});
  let tbl=`<div class="mtitle">สมาชิก (${ms.length})${g._extCount?` · <span style="color:var(--block)">นอกองค์กร ${g._extCount}</span>`:''}</div>`;
  if(!ms.length){ tbl+='<div class="sub">ไม่มีข้อมูลสมาชิก</div>'; }
  else{
    tbl+=`<table class="m"><thead><tr><th>อีเมล</th><th>บทบาท</th><th>ประเภท</th><th>สถานะ</th></tr></thead><tbody>`+
      ms.map(m=>`<tr class="${m.external?'ext':''}">
        <td>${esc(m.email)} ${m.external?'<span class="tag ext">นอกองค์กร</span>':''}</td>
        <td>${roleBadge(m.role||'MEMBER')}</td>
        <td>${m.type==='GROUP'?'<span class="tag grp">กลุ่มซ้อน</span>':esc((m.type||'USER').toLowerCase())}</td>
        <td>${esc(m.status||'active')}</td>
      </tr>`).join('')+`</tbody></table>`;
  }
  document.getElementById('detail').innerHTML=`<h2>📧 ${esc(g.name)}</h2><div class="sub">${esc(g.email)}</div>${kv}${tbl}`;
}

// ---------- actions (real API; friendly note in preview) ----------
async function doRefresh(){
  if(PREVIEW){ note('โหมดพรีวิว: ปุ่ม Sync จะทำงานเมื่อต่อ endpoint /api/groups/refresh แล้ว'); return; }
  const r=await fetch('/api/groups/refresh',{method:'POST'});
  if(r.status===409){ note('กำลัง sync อยู่แล้ว'); startPoll(); return; }
  if(!r.ok){ note('เริ่ม sync ไม่ได้ (HTTP '+r.status+')'); return; }
  startPoll();
}
function startPoll(){
  const btn=document.getElementById('refresh'); btn.disabled=true;
  document.getElementById('rico').outerHTML='<span class="spin" id="rico"></span>';
  document.getElementById('rtxt').textContent='กำลัง sync…';
  if(polling) clearInterval(polling);
  polling=setInterval(async()=>{
    try{ const s=await (await fetch('/api/groups/status')).json();
      if(!s.running){ clearInterval(polling); polling=null; location.reload(); }
    }catch(e){ clearInterval(polling); polling=null; }
  },3000);
}
function doExport(){
  if(PREVIEW){ note('โหมดพรีวิว: Export จะโหลดไฟล์จริงเมื่อต่อ endpoint /api/groups/export แล้ว'); return; }
  location.href='/api/groups/export';
}
function note(msg){ const e=document.getElementById('err'); e.textContent=msg; setTimeout(()=>{if(e.textContent===msg)e.textContent='';},4000); }

document.getElementById('q').oninput=()=>renderList();
boot();

// ================= SAMPLE DATA (ตัวอย่าง สำหรับพรีวิว layout เท่านั้น) =================
function SAMPLE(){
  const U=(l)=>l+"@21sunpassion.com";
  const g=(name,email,desc,allowExt,members,settings)=>({name,email,description:desc,memberCount:members.length,aliases:[],allowExternalMembers:!!allowExt,settings:settings||{whoCanJoin:"INVITED_CAN_JOIN",whoCanPostMessage:"ALL_MEMBERS_CAN_POST",whoCanViewMembership:"ALL_MEMBERS_CAN_VIEW"},members});
  const m=(email,role,type,ext)=>({email,role:role||"MEMBER",type:type||"USER",status:"active",external:ext!=null?ext:isExternalEmail(email)});
  return [
    g("Operation Bearhouse AI","operation.bearhouse.ai@21sunpassion.com","ทีมปฏิบัติการ Bearhouse",false,
      [m(U("mo"),"OWNER"),m(U("nont"),"MANAGER"),m(U("tonkla")),m(U("khaimuk")),m(U("ops01")),m(U("ops02")),m(U("ops03")),m(U("ops04")),m(U("ops05")),m(U("ops06")),m(U("ops07"))]),
    g("Operation QC","operation.qc@21sunpassion.com","ควบคุมคุณภาพ",false,[m(U("qc.lead"),"OWNER"),m(U("qc01"))]),
    g("PD Sunsu","pd.sunsu@21sunpassion.com","พัฒนาผลิตภัณฑ์ Sunsu",true,
      [m(U("pd.lead"),"OWNER"),m(U("pd01")),m(U("pd02")),m("consultant.rnd@gmail.com","MEMBER","USER",true)]),
    g("People","people@21sunpassion.com","ฝ่ายบุคคล",false,[m(U("hr.lead"),"OWNER"),m(U("hr01")),m(U("hr02"))]),
    g("People.Share.AI","people.share.ai@21sunpassion.com","แชร์ข้อมูล HR (archive)",false,
      [m(U("hr.lead"),"OWNER"),m(U("mo"),"MANAGER"),m(U("hr01")),m(U("hr02")),m(U("hr03")),m(U("hr04")),m(U("hr05")),m(U("hr06")),m(U("hr07"))],
      {whoCanJoin:"INVITED_CAN_JOIN",whoCanPostMessage:"ALL_MANAGERS_CAN_POST",whoCanViewMembership:"ALL_MANAGERS_CAN_VIEW"}),
    g("Product Development","sunsu.pd@21sunpassion.com","พัฒนาสินค้า",false,[m(U("pd.lead"),"OWNER"),m(U("pd03")),m(U("pd04"))]),
    g("Purchasing Sunsu","purchasing_sunsu@21sunpassion.com","จัดซื้อ Sunsu",true,
      [m(U("purchase.lead"),"OWNER"),m(U("purchase01")),m("supplier.contact@outlook.com","MEMBER","USER",true)]),
    g("QA SunSu","qa.sunsu@21sunpassion.com","ประกันคุณภาพ",false,[m(U("qa.lead"),"OWNER"),m(U("qa01"))]),
    g("QAQC-CK","qaqc-ck@21sunpassion.com","QA/QC สาขา CK",false,[m(U("qaqc.lead"),"OWNER"),m(U("qaqc01")),m(U("qaqc02"))]),
  ];
}
</script>
